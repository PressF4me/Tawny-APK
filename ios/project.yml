name: FrenTalk
options:
  bundleIdPrefix: com.frentalk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Put your 10-character Apple team id here, or set it in Xcode's
    # Signing & Capabilities tab after generating.
    DEVELOPMENT_TEAM: ""

targets:
  FrenTalk:
    type: application
    platform: iOS
    sources:
      - path: FrenTalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frentalk.monitor
        PRODUCT_NAME: FrenTalk
        INFOPLIST_FILE: FrenTalk/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
